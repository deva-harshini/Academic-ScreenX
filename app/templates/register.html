{% extends "base.html" %}

{% block title %}Register • Academic-ScreenX{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto py-16">
    <div class="bento-card p-6 border border-white/[0.08] shadow-xl space-y-6">
        
        <div class="space-y-1">
            <h1 class="text-lg font-semibold text-white tracking-tight">Create Faculty Account</h1>
            <p class="text-xs text-slate-400">Join the proposal evaluation committee</p>
        </div>

        <form id="register-form" class="space-y-3.5" onsubmit="handleRegisterSubmit(event)">
            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Full Name</label>
                <input type="text" id="name" required placeholder="Prof. Jane Doe" class="w-full bg-white/[0.03] border border-white/[0.08] focus:border-white/20 text-slate-200 text-xs rounded-lg px-3 py-2.5 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Email</label>
                <input type="email" id="email" required placeholder="faculty@university.edu" class="w-full bg-white/[0.03] border border-white/[0.08] focus:border-white/20 text-slate-200 text-xs rounded-lg px-3 py-2.5 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-[11px] font-medium text-slate-400 mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" minlength="6" class="w-full bg-white/[0.03] border border-white/[0.08] focus:border-white/20 text-slate-200 text-xs rounded-lg px-3 py-2.5 focus:outline-none transition">
            </div>

            <div id="register-error" class="hidden p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs"></div>

            <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-lg bg-white text-slate-900 hover:bg-slate-200 text-xs font-semibold transition">
                Create Account
            </button>
        </form>

        <div class="pt-4 border-t border-white/[0.06] text-center">
            <p class="text-[11px] text-slate-500">
                Already registered? <a href="/login" class="text-slate-300 hover:underline">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function handleRegisterSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('register-error');
    const submitBtn = document.getElementById('submit-btn');

    errorDiv.classList.add('hidden');
    submitBtn.disabled = true;

    try {
        const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, role: 'faculty' })
        });

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || 'Registration failed.');
        }

        window.location.href = '/dashboard';
    } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
    } finally {
        submitBtn.disabled = false;
    }
}
</script>
{% endblock %}
